[package]
name = "sitef-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agente local que embrulha a biblioteca CliSiTef (Software Express) e a expõe por um protocolo WebSocket limpo e genérico."
repository = ""
readme = "README.md"

[features]
default = ["simulator"]
# Implementação roteirizada, sem hardware — para desenvolvimento e testes.
simulator = []
# Binding nativo que carrega a DLL/.so da CliSiTef fornecida pelo usuário.
native = ["dep:libloading"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libloading = { version = "0.8", optional = true }
